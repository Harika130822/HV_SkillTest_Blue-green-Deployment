apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: bluegreen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: hv_skilltest_blue-green-deployment-backend:v1
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: bluegreen-config
                  key: PORT_BACKEND
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: bluegreen-secret
                  key: MONGO_URI
