apiVersion: v1
kind: Service
metadata:
  name: frontend-blue-service
  namespace: bluegreen
spec:
  type: ClusterIP
  selector:
    app: frontend-blue
  ports:
    - name: http
      port: 3100
      targetPort: 3100

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-green-service
  namespace: bluegreen
spec:
  type: ClusterIP
  selector:
    app: frontend-green
  ports:
    - name: http
      port: 3200
      targetPort: 3200

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: bluegreen
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
