services:
  mongodb:
    image: mongo:7
    container_name: bluegreen-mongodb
    restart: unless-stopped
    networks:
      - bluegreen-network
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bluegreen-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/bluegreenDeploy
    networks:
      - bluegreen-network
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend-blue:
    build:
      context: .
      dockerfile: frontend-blue/Dockerfile
    container_name: bluegreen-frontend-blue
    restart: unless-stopped
    environment:
      PORT: 3100
    networks:
      - bluegreen-network
    ports:
      - "3100:3100"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend-green:
    build:
      context: .
      dockerfile: frontend-green/Dockerfile
    container_name: bluegreen-frontend-green
    restart: unless-stopped
    environment:
      PORT: 3200
    networks:
      - bluegreen-network
    ports:
      - "3200:3200"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb-data:

networks:
  bluegreen-network:
    driver: bridge
